<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bon de commande - Mes Delices d'Allemagne</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --bg:#f6f1ea; --card:#fff; --ink:#1d1511; --muted:#7a6d63; --line:#e4d9cc; --accent:#9c5a28;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#181310; --card:#241d18; --ink:#f3ece4; --muted:#a89a8d; --line:#3a2f27; --accent:#e0a064; } }
  :root[data-theme="dark"] { --bg:#181310; --card:#241d18; --ink:#f3ece4; --muted:#a89a8d; --line:#3a2f27; --accent:#e0a064; }
  * { box-sizing:border-box; touch-action:manipulation; }
  html { color-scheme: light dark; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Helvetica Neue",Arial,sans-serif; line-height:1.45; }
  .wrap { width:min(760px,100% - 32px); margin:0 auto; padding:20px 0 40px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:15px; }
  textarea, input { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font:inherit; font-size:16px; }
  textarea { min-height:170px; resize:vertical; }
  .row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; margin:12px 0; }
  label { min-width:0; display:block; }
  input[type=date] { min-width:0; max-width:100%; -webkit-appearance:none; appearance:none; text-align:left; }
  label span { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 20px; }
  button { padding:13px 20px; border:0; border-radius:999px; font:inherit; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; }
  button.alt { background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .err { color:#b3261e; margin:8px 0 0; min-height:1.4em; font-size:14px; }

  /* Le bon s'affiche comme le PDF : page A4 avec le fond */
  .sheet { position:relative; width:100%; aspect-ratio:210/297; container-type:inline-size; overflow:hidden; background:#efe6d6 center/100% 100% no-repeat; border-radius:6px; margin:0 0 14px; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .sheet span { position:absolute; white-space:pre; line-height:1; }
  .sheet i { position:absolute; display:block; }
  @media (max-width:520px) { .row { grid-template-columns:1fr; } }
  @media print {
    :root { padding:0; } body { background:#fff; } .no-print { display:none !important; }
    .wrap { width:100%; padding:0; } .sheet { margin:0; border-radius:0; box-shadow:none; break-after:page; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="no-print">
    <h1>Bon de commande</h1>
    <p class="sub">Collez le message WhatsApp reçu du client, puis générez le bon.</p>
    <textarea id="msg" placeholder="Collez ici le message de commande reçu sur WhatsApp"></textarea>
    <div class="row">
      <label><span>Numéro du BC</span><input id="num" type="text" placeholder="Ex : commande Bordj El Bahri"></label>
      <label><span>Date de livraison</span><input id="liv" type="date"></label>
    </div>
    <div class="btns">
      <button type="button" id="go">Générer le bon</button>
      <button type="button" class="alt" id="print">Télécharger le PDF</button>
    </div>
    <p class="err" id="err" role="alert"></p>
  </div>

  <div id="bon" hidden></div>
</div>

    var m = text.match(re);

  function parseItems(text) {
    var items = [], sum = 0, m;
    // 1) lignes du site : "- 2 x Roulé Mangue : 400 DA" (montant = total de la ligne)
    var re = /(\d+)\s*x\s*([^:\n]+?)\s*:\s*([\d\s\u00a0\u202f]+?)\s*DA/gi;
    while ((m = re.exec(text))) {
      var q = parseInt(m[1], 10), amount = num(m[3].replace(/[\u00a0\u202f]/g, " "));
      items.push({ name: m[2].trim(), q: q, rate: Math.round(amount / q), amount: amount });
      sum += amount;
    }
    // 2) lignes ajoutées à la main : "brownie 200da" ou "2 brownie 200da" (prix = prix unitaire)
    var rest = text.replace(re, " ")
      .replace(/Bonjour[^\n:]*:/gi, " ")
      .replace(/Total\s*:\s*[\d\s\u00a0\u202f]+DA/gi, " ")

    while ((m = re2.exec(rest))) {
      var q2 = m[1] ? parseInt(m[1], 10) : 1, rate = num(m[3]);
      items.push({ name: m[2].trim().replace(/^./, function (c) { return c.toUpperCase(); }), q: q2, rate: rate, amount: rate * q2 });
      sum += rate * q2;
    }
    return { items: items, sum: sum };

  }

  $("go").addEventListener("click", function () {
    var text = $("msg").value, r = parseItems(text);
    if (!r.items.length) { $("err").textContent = "Aucun produit trouvé. Collez le message complet reçu sur WhatsApp."; return; }
    $("err").textContent = "";
    cur = {
      nom: field(text, /Nom\s*:\s*(.+?)(?=\s*T[ée]l[ée]phone\s*:|\s*$)/is) || "-",
      tel: field(text, /T[ée]l[ée]phone\s*:\s*(.+?)(?=\s*Type\s*:|\s*$)/is) || "-",
      type: field(text, /Type\s*:\s*(A emporter|À emporter|Livraison|\S+)/i) || "-",
      adr: field(text, /Adresse\s*:\s*(.+)$/is),
      num: $("num").value.trim() || "BC-" + today.toISOString().slice(2, 10).replace(/-/g, "") + "-" + String(today.getHours()).padStart(2, "0") + String(today.getMinutes()).padStart(2, "0"),
      date: fmtDate(today),
      liv: $("liv").value ? fmtDate(new Date($("liv").value + "T12:00:00")) : "-",
      total: "DZD " + money(r.sum),
      items: r.items.map(function (it) { return [it.name, it.q, money(it.rate), money(it.amount)]; })
    };
    renderDom(layout(cur, meas), $("bon"));
    $("bon").hidden = false;
    $("bon").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  $("print").addEventListener("click", async function () {
    if (!cur) { $("err").textContent = "Générez d'abord le bon."; return; }
    $("err").textContent = "";
    var name = ("bon-" + cur.nom + "-" + cur.num).replace(/[^\w\-]+/g, "_") + ".pdf";
    try {
      var d = new JS({ unit: "mm", format: "a4" });
      renderPdf(layout(cur, d), d);
      var blob = d.output("blob");
      var dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (dl) { await dl.save({ filename: name, data: blob }); }
      else {
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
      }
    } catch (e) {
      if (!e || e.code !== "declined") $("err").textContent = "Impossible de créer le PDF. Réessayez.";
    }
  });
})();
</script>
</body>
</html>
